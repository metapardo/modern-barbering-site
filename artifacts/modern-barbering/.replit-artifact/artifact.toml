kind = "web"
previewPath = "/"
title = "Modern Barbering NYC"
description = "A premium Manhattan barbering brand website for a flagship salon and mobile chair service, designed as a cinematic, editorial single-page experience for clients who need to feel ready for what comes next."
version = "1.0.0"
id = "artifacts/modern-barbering"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21013

[services.development]
run = "pnpm --filter @workspace/modern-barbering run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/modern-barbering", "run", "build" ]
serve = "static"
publicDir = "artifacts/modern-barbering/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21013"
BASE_PATH = "/"
