openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /event-requests:
    post:
      operationId: createEventRequest
      summary: Submit an event inquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRequestInput"
      responses:
        "201":
          description: Inquiry saved, not a confirmed booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRequestReceipt"
        "400":
          description: Invalid inquiry
        "429":
          description: Too many inquiries
        "500":
          description: Inquiry could not be saved
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    EventRequestInput:
      type: object
      required: [contactName, contactEmail, eventType, date, readyByTime, numberOfGuests, location, servicesNeeded]
      properties:
        contactName:
          type: string
          minLength: 1
          maxLength: 120
        contactEmail:
          type: string
          format: email
          maxLength: 254
        eventType:
          type: string
          minLength: 1
          maxLength: 120
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        readyByTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        numberOfGuests:
          type: integer
          minimum: 1
          maximum: 1000
        location:
          type: string
          minLength: 1
          maxLength: 500
        servicesNeeded:
          type: string
          minLength: 1
          maxLength: 2000
        notes:
          type: string
          maxLength: 4000
    EventRequestReceipt:
      type: object
      required: [reference, status]
      properties:
        reference:
          type: string
        status:
          type: string
          enum: [received]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

